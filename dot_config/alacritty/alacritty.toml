# ~/.config/alacritty/alacritty.toml
# Minimal Alacritty config (TOML) with quake window class.

# Window settings
[window]
dynamic_title = true

[window.class]
instance = "alacritty"
general = "quake"

[window.dimensions]
# initial columns/lines if you want them; optional
columns = 120
lines = 30

# Font
[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
bold = { family = "DejaVu Sans Mono", style = "Bold" }
# size in points
size = 8.0
# dpi = 96.0  # uncomment and adjust if you need custom DPI

# Colors (Gruvbox-like palette matching your Qtile colors)
[colors]
  [colors.primary]
  background = "#282828"
  foreground = "#ebdbb2"

  [colors.normal]
  black  = "#282828"
  red    = "#fb4934"
  green  = "#b8bb26"
  yellow = "#fabd2f"
  blue   = "#83a598"
  magenta= "#d3869b"
  cyan   = "#8ec07c"
  white  = "#ebdbb2"

  [colors.bright]
  black  = "#928374"
  red    = "#fb4934"
  green  = "#b8bb26"
  yellow = "#fabd2f"
  blue   = "#83a598"
  magenta= "#d3869b"
  cyan   = "#8ec07c"
  white  = "#fbf1c7"

# Cursor style
[cursor]
style = "Beam"

# Scrolling
[scrolling]
history = 10000
multiplier = 3

# Mouse
# mouse_hide_when_typing = true
# mouse_bindings = [
#   { mouse = { Left = 1 }, action = "PasteSelection" }
# ]

# Key bindings (keep default behavior; add any custom keybindings below)
# Example: toggle fullscreen with F11 (uncomment to enable)
# key_bindings = [
#   { key = "F11",  action = "ToggleFullscreen" }
# ]

# Shell program (inherit from environment by default)
# Uncomment to force a particular shell:
# shell.program = "/bin/bash"
# shell.args = ["-l"]

# Other behavior
# live_config_reload = true
# use_proxy = false

